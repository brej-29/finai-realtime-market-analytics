[project]
name = "finai-realtime-market-analytics-api"
version = "0.1.0"
description = "FastAPI backend for the finai realtime market analytics dashboard."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
]
ignore = [
  "E203",  # whitespace before ':'
  "E501",  # line length handled by formatter / editor
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.mypy]
# 3.12+ so mypy can parse PEP 695 `type` statements in modern numpy stubs;
# runtime still supports Python 3.11.
python_version = "3.12"
pretty = true
show_error_codes = true
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false