version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: finai
      POSTGRES_DB: finai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://finai:finai@db:5432/finai
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: {}